<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuesta · Máquina de Muñecos · Neto Veracruz</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#13294b; --navy2:#1e3a6b; --orange:#f47920; --teal:#1FA89B;
    --si:#1FA89B; --no:#e05555; --pend:#c8ccd4;
    --bg:#f3f5f9; --card:#ffffff; --line:#e4e8ef; --ink:#1b2534; --muted:#6b7688;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-tap-highlight-color:transparent;padding-bottom:40px}
  header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:16px 18px;
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .logo{width:40px;height:40px;border-radius:10px;background:var(--orange);display:grid;place-items:center;
    font-size:22px;flex:0 0 auto}
  header h1{font-size:16px;font-weight:700;line-height:1.15}
  header p{font-size:11px;opacity:.75;font-weight:400}
  .demo-banner{background:#fff5e6;color:#8a5200;font-size:12px;text-align:center;padding:6px;
    border-bottom:1px solid #f0d9a8;font-weight:600}
  .tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:72px;z-index:15}
  .tab{flex:1;padding:13px;text-align:center;font-weight:700;font-size:14px;color:var(--muted);
    border-bottom:3px solid transparent;cursor:pointer;user-select:none}
  .tab.active{color:var(--navy);border-bottom-color:var(--orange)}
  .wrap{max-width:640px;margin:0 auto;padding:18px 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px 2px;
    text-transform:uppercase;letter-spacing:.4px}
  select,input[type=text]{width:100%;padding:13px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;background:#fff;color:var(--ink);margin-bottom:14px;appearance:none}
  select:focus,input:focus{outline:none;border-color:var(--navy2)}
  select:disabled{background:#f1f2f5;color:#aab}
  .q{font-size:17px;font-weight:700;text-align:center;margin:6px 0 16px;color:var(--navy)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .big{padding:26px 10px;border:none;border-radius:14px;font-size:22px;font-weight:800;color:#fff;
    cursor:pointer;transition:transform .05s, filter .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
  .big:active{transform:scale(.97)}
  .big.si{background:var(--si)} .big.no{background:var(--no)}
  .big:disabled{opacity:.4;cursor:not-allowed}
  .big small{font-size:12px;font-weight:600;opacity:.9;text-transform:uppercase;letter-spacing:1px}
  .msg{text-align:center;padding:14px;border-radius:10px;font-weight:700;margin-top:14px;display:none}
  .msg.ok{background:#e6f6f3;color:#0d6e60;display:block}
  .msg.err{background:#fdeaea;color:#b02a2a;display:block}
  .msg.load{background:#eef2fb;color:#3552a0;display:block}
  /* Resumen */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
  .stat .n{font-size:26px;font-weight:800;line-height:1}
  .stat .l{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:4px;letter-spacing:.3px}
  .stat.si .n{color:var(--si)} .stat.no .n{color:var(--no)} .stat.pend .n{color:#9aa2b1} .stat.tot .n{color:var(--navy)}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .filters .full{grid-column:1/-1}
  .filters select,.filters input{margin-bottom:0}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:var(--navy);color:#fff;padding:9px 8px;text-align:left;font-size:11px;text-transform:uppercase;
    letter-spacing:.3px;position:sticky;top:0}
  td{padding:9px 8px;border-bottom:1px solid var(--line)}
  tr:nth-child(even) td{background:#fafbfd}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;color:#fff}
  .pill.si{background:var(--si)} .pill.no{background:var(--no)} .pill.pend{background:#aab1bd}
  .tablebox{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
  .toolbar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
  .btn{padding:10px 16px;border:none;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;
    background:var(--navy);color:#fff}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
  .btn.orange{background:var(--orange)}
  .chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;height:220px;position:relative}
  .gate{max-width:340px;margin:60px auto;text-align:center}
  .hide{display:none!important}
  .eco{font-weight:700;color:var(--navy2)}
  @media(max-width:480px){
    .stats{grid-template-columns:repeat(2,1fr)}
    header h1{font-size:14px}
    td,th{padding:8px 6px;font-size:12px}
  }
</style>
</head>
<body>

<header>
  <div class="logo">🎯</div>
  <div>
    <h1>Encuesta · Máquina de Muñecos</h1>
    <p>Neto · Compañía Veracruz</p>
  </div>
</header>
<div class="demo-banner hide" id="demoBanner">⚠️ MODO DEMO — configura APPS_SCRIPT_URL para guardar en la nube</div>

<div class="tabs">
  <div class="tab active" data-tab="responder">Responder</div>
  <div class="tab" data-tab="resumen">Resumen</div>
</div>

<!-- ================= RESPONDER ================= -->
<div class="wrap" id="tab-responder">
  <div class="card">
    <label>Región</label>
    <select id="selRegion"><option value="">Selecciona región…</option></select>

    <label>Zona</label>
    <select id="selZona" disabled><option value="">Selecciona zona…</option></select>

    <label>Tienda</label>
    <select id="selTienda" disabled><option value="">Selecciona tienda…</option></select>

    <label>Nombre de quien responde (opcional)</label>
    <input type="text" id="inpUsuario" placeholder="Ej. Ignacio Arcos" />
  </div>

  <div class="card" id="questionCard" style="opacity:.5;pointer-events:none">
    <div class="q">¿Esta tienda tiene máquina de muñecos (grúa)?</div>
    <div class="btns">
      <button class="big si" id="btnSi" disabled>✅<span>SÍ</span><small>tiene máquina</small></button>
      <button class="big no" id="btnNo" disabled>❌<span>NO</span><small>no tiene</small></button>
    </div>
    <div class="msg" id="respMsg"></div>
  </div>
</div>

<!-- ================= RESUMEN ================= -->
<div class="wrap hide" id="tab-resumen">
  <!-- Gate -->
  <div class="gate card" id="gate">
    <div class="q">🔒 Acceso al resumen</div>
    <input type="text" id="pass" placeholder="Contraseña" style="text-align:center">
    <button class="btn orange" style="width:100%" onclick="checkPass()">Entrar</button>
    <div class="msg err" id="gateMsg"></div>
  </div>

  <div id="resumenBody" class="hide">
    <div class="stats">
      <div class="stat tot"><div class="n" id="stTot">0</div><div class="l">Tiendas</div></div>
      <div class="stat si"><div class="n" id="stSi">0</div><div class="l">Con máquina</div></div>
      <div class="stat no"><div class="n" id="stNo">0</div><div class="l">Sin máquina</div></div>
      <div class="stat pend"><div class="n" id="stPend">0</div><div class="l">Pendientes</div></div>
    </div>

    <div class="chartbox"><canvas id="chart"></canvas></div>

    <div class="card" style="padding:14px">
      <div class="filters">
        <div><label>Región</label><select id="fRegion"><option value="">Todas</option></select></div>
        <div><label>Zona</label><select id="fZona"><option value="">Todas</option></select></div>
        <div><label>Estado</label>
          <select id="fEstado">
            <option value="">Todos</option>
            <option value="Sí">Con máquina (Sí)</option>
            <option value="No">Sin máquina (No)</option>
            <option value="Pendiente">Pendientes</option>
          </select>
        </div>
        <div><label>Buscar</label><input type="text" id="fBuscar" placeholder="ECO o nombre…"></div>
      </div>
      <div class="toolbar">
        <button class="btn" onclick="cargarResumen()">🔄 Actualizar</button>
        <button class="btn orange" onclick="exportCSV()">⬇️ Exportar CSV</button>
      </div>
    </div>

    <div class="tablebox">
      <table>
        <thead><tr><th>ECO</th><th>Tienda</th><th>Región</th><th>Zona</th><th>Estado</th><th>Fecha</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="msg load hide" id="resMsg" style="margin-top:12px"></div>
  </div>
</div>

/* ============================================================
   LÓGICA
   ============================================================ */
const DEMO = !APPS_SCRIPT_URL;
if(DEMO) document.getElementById('demoBanner').classList.remove('hide');
let DEMO_STORE = {}; // {eco: {respuesta, usuario, fecha}}

// ---- Índices del catálogo ----
const byEco = {};
CATALOGO.forEach(t=>byEco[t.eco]=t);
const regiones = [...new Set(CATALOGO.map(t=>t.region))].sort();

// ---- Tabs ----
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const tab=t.dataset.tab;
  document.getElementById('tab-responder').classList.toggle('hide',tab!=='responder');
  document.getElementById('tab-resumen').classList.toggle('hide',tab!=='resumen');
});

// ---- Selectores en cascada ----
const selR=document.getElementById('selRegion'), selZ=document.getElementById('selZona'), selT=document.getElementById('selTienda');
regiones.forEach(r=>selR.add(new Option(r,r)));

selR.onchange=()=>{
  selZ.innerHTML='<option value="">Selecciona zona…</option>';
  selT.innerHTML='<option value="">Selecciona tienda…</option>';
  selT.disabled=true; setQuestion(false);
  if(!selR.value){selZ.disabled=true;return;}
  const zonas=[...new Set(CATALOGO.filter(t=>t.region===selR.value).map(t=>t.zona))].sort();
  zonas.forEach(z=>selZ.add(new Option(z,z)));
  selZ.disabled=false;
};
selZ.onchange=()=>{
  selT.innerHTML='<option value="">Selecciona tienda…</option>';
  setQuestion(false);
  if(!selZ.value){selT.disabled=true;return;}
  CATALOGO.filter(t=>t.region===selR.value && t.zona===selZ.value)
    .sort((a,b)=>a.eco-b.eco)
    .forEach(t=>selT.add(new Option(`${t.eco} · ${t.nombre}`,t.eco)));
  selT.disabled=false;
};
selT.onchange=()=>setQuestion(!!selT.value);

function setQuestion(on){
  const c=document.getElementById('questionCard');
  c.style.opacity=on?'1':'.5'; c.style.pointerEvents=on?'auto':'none';
  document.getElementById('btnSi').disabled=!on;
  document.getElementById('btnNo').disabled=!on;
  document.getElementById('respMsg').className='msg';
}

// ---- JSONP helper (patrón GET, sin CORS) ----
function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);
    const s=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('timeout'))},15000);
    function cleanup(){clearTimeout(timer);delete window[cb];s.remove();}
    window[cb]=d=>{cleanup();resolve(d);};
    s.onerror=()=>{cleanup();reject(new Error('network'));};
    const q=Object.entries(params).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
    s.src=APPS_SCRIPT_URL+'?callback='+cb+'&'+q;
    document.body.appendChild(s);
  });
}

// ---- Guardar respuesta ----
async function responder(resp){
  const eco=selT.value; if(!eco) return;
  const t=byEco[eco];
  const usuario=document.getElementById('inpUsuario').value.trim();
  const msg=document.getElementById('respMsg');
  document.getElementById('btnSi').disabled=true; document.getElementById('btnNo').disabled=true;
  msg.className='msg load'; msg.textContent='Guardando…';
  const payload={eco, tienda:t.nombre, region:t.region, zona:t.zona, respuesta:resp, usuario};
  try{
    if(DEMO){
      DEMO_STORE[eco]={respuesta:resp,usuario,fecha:new Date().toISOString()};
    }else{
      const r=await jsonp({action:'save',...payload});
      if(r&&r.error) throw new Error(r.error);
    }
    msg.className='msg ok';
    msg.textContent=`✔ Registrado: ${t.nombre} → ${resp.toUpperCase()}`;
    setTimeout(()=>{ // reset para la siguiente tienda
      selT.value=''; setQuestion(false);
    },1200);
  }catch(e){
    msg.className='msg err'; msg.textContent='Error al guardar. Reintenta. ('+e.message+')';
    document.getElementById('btnSi').disabled=false; document.getElementById('btnNo').disabled=false;
  }
}
document.getElementById('btnSi').onclick=()=>responder('Sí');
document.getElementById('btnNo').onclick=()=>responder('No');

/* ============================================================

   ============================================================ */
function checkPass(){
  const v=document.getElementById('pass').value;
  if(v===RESUMEN_PASS){
    document.getElementById('gate').classList.add('hide');
    document.getElementById('resumenBody').classList.remove('hide');
    initFiltros(); cargarResumen();
  }else{
    document.getElementById('gateMsg').textContent='Contraseña incorrecta';
  }
}
document.getElementById('pass')?.addEventListener('keydown',e=>{if(e.key==='Enter')checkPass();});

function initFiltros(){
  const fr=document.getElementById('fRegion');
  regiones.forEach(r=>fr.add(new Option(r,r)));
  fr.onchange=()=>{
    const fz=document.getElementById('fZona');
    fz.innerHTML='<option value="">Todas</option>';
    const zs=[...new Set(CATALOGO.filter(t=>!fr.value||t.region===fr.value).map(t=>t.zona))].sort();
    zs.forEach(z=>fz.add(new Option(z,z)));
    render();
  };
  const zAll=[...new Set(CATALOGO.map(t=>t.zona))].sort();
  zAll.forEach(z=>document.getElementById('fZona').add(new Option(z,z)));
  ['fZona','fEstado'].forEach(id=>document.getElementById(id).onchange=render);
  document.getElementById('fBuscar').oninput=render;
}

let RESPUESTAS={}; // {eco:{respuesta,usuario,fecha}}
let chart=null;

async function cargarResumen(){
  const m=document.getElementById('resMsg'); m.classList.remove('hide'); m.textContent='Cargando datos…';
  try{
    if(DEMO){ RESPUESTAS={...DEMO_STORE}; }
    else{
      const r=await jsonp({action:'list'});
      RESPUESTAS={};
      (r.rows||r||[]).forEach(x=>{ RESPUESTAS[x.eco]={respuesta:x.respuesta,usuario:x.usuario,fecha:x.fecha}; });
    }
    m.classList.add('hide'); render();
  }catch(e){ m.className='msg err'; m.textContent='Error al cargar: '+e.message; }
}

function filas(){
  const fr=document.getElementById('fRegion').value, fz=document.getElementById('fZona').value,
        fe=document.getElementById('fEstado').value, fb=document.getElementById('fBuscar').value.toLowerCase();
  return CATALOGO.map(t=>{
    const r=RESPUESTAS[t.eco];
    const estado=r?r.respuesta:'Pendiente';
    return {...t, estado, fecha:r?r.fecha:''};
  }).filter(x=>
    (!fr||x.region===fr)&&(!fz||x.zona===fz)&&
    (!fe|| (fe==='Pendiente'?x.estado==='Pendiente':x.estado===fe))&&
    (!fb|| String(x.eco).includes(fb)||x.nombre.toLowerCase().includes(fb))
  ).sort((a,b)=>a.region.localeCompare(b.region)||a.zona.localeCompare(b.zona)||a.eco-b.eco);
}

function render(){
  const rows=filas();
  // stats (sobre TODO el catálogo, no filtrado, para totales reales)
  let si=0,no=0,pend=0;
  CATALOGO.forEach(t=>{const r=RESPUESTAS[t.eco]; if(!r)pend++; else if(r.respuesta==='Sí')si++; else no++;});
  document.getElementById('stTot').textContent=CATALOGO.length;
  document.getElementById('stSi').textContent=si;
  document.getElementById('stNo').textContent=no;
  document.getElementById('stPend').textContent=pend;
  // tabla
  const tb=document.getElementById('tbody');
  tb.innerHTML=rows.map(x=>{
    const cls=x.estado==='Sí'?'si':x.estado==='No'?'no':'pend';
    const lbl=x.estado==='Pendiente'?'Pendiente':x.estado;
    const f=x.fecha?new Date(x.fecha).toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';
    return `<tr><td class="eco">${x.eco}</td><td>${x.nombre}</td><td>${x.region}</td><td>${x.zona}</td>
      <td><span class="pill ${cls}">${lbl}</span></td><td>${f}</td></tr>`;
  }).join('')||'<tr><td colspan="6" style="text-align:center;padding:20px;color:#98a">Sin resultados</td></tr>';
  // chart
  drawChart(si,no,pend);
}

function drawChart(si,no,pend){
  const ctx=document.getElementById('chart');
  const data={labels:['Con máquina','Sin máquina','Pendientes'],
    datasets:[{data:[si,no,pend],backgroundColor:['#1FA89B','#e05555','#c8ccd4'],borderWidth:0}]};
  if(chart){chart.data=data;chart.update();return;}
  chart=new Chart(ctx,{type:'doughnut',data,options:{responsive:true,maintainAspectRatio:false,cutout:'62%',
    plugins:{legend:{position:'bottom',labels:{font:{size:12,weight:'600'},padding:12}}}}});
}

function exportCSV(){
  const rows=filas();
  const head=['ECO','Tienda','Region','Zona','Estado','Fecha'];
  const lines=[head.join(',')].concat(rows.map(x=>
    [x.eco,`"${x.nombre}"`,`"${x.region}"`,`"${x.zona}"`,x.estado,x.fecha||''].join(',')));
  const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='encuesta_maquina_munecos.csv'; a.click();
}
